name: yunost

services:
  web:
    build: .
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Supabase__Url: ${SUPABASE_URL:?Set SUPABASE_URL}
      Supabase__PublishableKey: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      Supabase__SecretKeyFile: /run/secrets/supabase_secret
      DataProtection__Path: /app/data/keys
    secrets:
      - supabase_secret
    volumes:
      - session_keys:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

secrets:
  supabase_secret:
    file: ${SUPABASE_SECRET_FILE:?Set SUPABASE_SECRET_FILE}

volumes:
  session_keys:
