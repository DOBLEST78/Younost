server {
    listen 80;
    server_name yunost.localhost;
    return 301 https://yunost.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name yunost.localhost;

    ssl_certificate /etc/nginx/certs/yunost.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/yunost.localhost-key.pem;

    location / {
        proxy_pass http://web:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
